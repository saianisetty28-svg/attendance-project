<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset password - Attendance</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Reset password</h1>
            <p class="subtitle">Enter your new password</p>
            <div id="message" class="message" hidden></div>
            <div id="tokenWarning" class="message error" hidden>No reset token in URL. Use the link from your email.</div>
            <form id="resetForm">
                <label for="password">New password</label>
                <input type="password" id="password" required autocomplete="new-password">
                <label for="confirm">Confirm password</label>
                <input type="password" id="confirm" required autocomplete="new-password">
                <button type="submit">Reset password</button>
            </form>
            <div class="links"><a href="login.html">Back to login</a></div>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");
        const messageEl = document.getElementById("message");
        const tokenWarning = document.getElementById("tokenWarning");
        const form = document.getElementById("resetForm");
        if (!token) { tokenWarning.hidden = false; form.querySelector("button").disabled = true; }
        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const password = document.getElementById("password").value;
            const confirm = document.getElementById("confirm").value;
            if (password !== confirm) { showMessage(messageEl, "Passwords do not match", true); return; }
            const data = await apiPost("/reset-password", { token, new_password: password });
            if (data.message === "Password reset successful") {
                showMessage(messageEl, "Password updated! Redirecting to login...", false);
                setTimeout(() => { window.location.href = "login.html"; }, 1500);
                return;
            }
            showMessage(messageEl, data.message || "Reset failed", true);
        });
    </script>
