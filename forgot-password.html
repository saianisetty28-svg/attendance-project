<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot password - Attendance</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Forgot password</h1>
            <p class="subtitle">We will send a reset link to your email</p>

            <div id="message" class="message" hidden></div>

            <form id="forgotForm">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autocomplete="email">

                <button type="submit">Send reset link</button>
            </form>

            <div class="links">
                <a href="login.html">Back to login</a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        const form = document.getElementById("forgotForm");
        const messageEl = document.getElementById("message");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            showMessage(messageEl, "", false);

            const email = document.getElementById("email").value.trim();
            const data = await apiPost("/forgot-password", { email });

            showMessage(
                messageEl,
                data.message || "Request submitted",
                data.message && data.message.includes("failed")
            );
        });
    </script>
</body>
</html>
