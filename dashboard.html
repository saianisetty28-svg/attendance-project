<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="has-sidebar">
    <div class="sidebar">
        <div class="sidebar-header">Attendance</div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="active">Dashboard</a>
            <a href="attendance.html">Attendance</a>
            <div class="settings-item">
                <a href="#" id="settingsToggle" class="settings-link">Settings ▾</a>
                <div class="settings-menu" id="settingsMenu">
                    <a href="profile.html">Profile</a>
                    <button id="sidebarLogout" class="link-button">Logout</button>
                </div>
            </div>
        </nav>
    </div>
    <div class="container wide">
        <div class="card custom-card">
            <h1>Dashboard</h1>
            <p class="subtitle">Protected area</p>
            <nav class="nav d-grid gap-3">
            </nav>
            <div id="message" class="message" hidden></div>
            <div class="info-box" id="dashboardContent"><p>Loading...</p></div>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/js/bootstrap.bundle.min.js"></script>
    <script>
       
        requireAuth();
        const messageEl = document.getElementById("message");
        const contentEl = document.getElementById("dashboardContent");
        async function loadDashboard() {
            const data = await apiGetWithRefresh("/dashboard");
            if (data.user) {
                    const u = data.user;
                    const name = u.name || u.email || 'User';
                    contentEl.innerHTML = `<p>Welcome to dashboard, ${name}</p>`;
                    return;
                }
            showMessage(messageEl, data.message || "Could not load dashboard", true);
            if ((data.message || "").includes("Invalid") || (data.message || "").includes("expired")) {
                setTimeout(() => { clearAuth(); window.location.href = "login.html"; }, 2000);
            }
        }
        const logoutBtn = document.getElementById("logoutBtn");
        if (logoutBtn) {
            logoutBtn.addEventListener("click", async () => {
                await apiPost("/logout", {}, true);
                clearAuth();
                window.location.href = "login.html";
            });
        }
        loadDashboard();

        // Sidebar settings toggle & logout
        const settingsToggle = document.getElementById('settingsToggle');
        const settingsMenu = document.getElementById('settingsMenu');
        if (settingsToggle && settingsMenu) {
            settingsToggle.addEventListener('click', (e) => {
                e.preventDefault();
                settingsMenu.classList.toggle('open');
            });
            document.addEventListener('click', (e) => {
                if (!settingsMenu.contains(e.target) && e.target !== settingsToggle) {
                    settingsMenu.classList.remove('open');
                }
            });
        }

        const sidebarLogout = document.getElementById('sidebarLogout');
        if (sidebarLogout) {
            sidebarLogout.addEventListener('click', async () => {
                await apiPost('/logout', {}, true);
                clearAuth();
                window.location.href = 'login.html';
            });
        }
    </script>
